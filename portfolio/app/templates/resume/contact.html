{% if user %}

    <div class="page-title portfolio-section" data-aos="fade" id="contact">
      <div class="heading">
        <div class="container">
          <div class="row d-flex justify-content-center text-center">
            <div class="col-lg-8">
              <h1>Contact</h1>
              <p class="mb-0">If you want to know more about me or my work, or if you would just
                like to say hello, send me a message. I'd love to hear from you..</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section class="contact section">

      <div class="container" data-aos="fade-up" data-aos-delay="100">

        <div class="row gy-4">

          <div class="col-md-6">
            <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="200">
              <i class="icon bi bi-geo-alt flex-shrink-0"></i>
              <div>
                <h3>Address</h3>
                <p>{{ user.address }}</p>
              </div>
            </div>
          </div><!-- End Info Item -->

          <div class="col-md-6">
            <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="300">
              <i class="icon bi bi-telephone flex-shrink-0"></i>
              <div>
                <h3>Call Me</h3>
                <p>{{ user.phone }}</p>
              </div>
            </div>
          </div><!-- End Info Item -->

          <div class="col-md-6">
            <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="400">
              <i class="icon bi bi-envelope flex-shrink-0"></i>
              <div>
                <h3>Email</h3>
                <p>{{ user.email }}</p>
              </div>
            </div>
          </div><!-- End Info Item -->

          <div class="col-md-6">
            <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="500">
              <i class="icon bi bi-share flex-shrink-0"></i>
              <div>
                <h3>Social Profiles</h3>
                <div class="social-links">
                  <a href="https://{{ user.twitter.replace('https://','') }}" target="_blank"><i class="bi bi-twitter-x"></i></a>
                  <a href="https://{{ user.facebook.replace('https://','') }}" target="_blank"><i class="bi bi-facebook"></i></a>
                  <a href="https://{{ user.instagram.replace('https://','') }}" target="_blank"><i class="bi bi-instagram"></i></a>
                  <a href="https://{{ user.linkedin.replace('https://','') }}" target="_blank"><i class="bi bi-linkedin"></i></a>
                </div>
              </div>
            </div>
          </div><!-- End Info Item -->

        </div>




        <form action="/add/contacts" method="post"  data-aos="fade-up" data-aos-delay="600">
          <div class="row gy-4">

            <div class="col-md-6">
              <input type="hidden" name="user_id" class="form-control" value="{{ user.id }}" required>
              <input type="hidden" name="user_email" class="form-control" value="{{ user.email }}" required>
              <input type="text" name="name" class="form-control" placeholder="Your Name" required="">
            </div>

            <div class="col-md-6 ">
              <input type="email" class="form-control" name="email" placeholder="Your Email" required="">
            </div>

            <div class="col-md-12">
              <input type="text" class="form-control" name="subject" placeholder="Subject" required="">
            </div>

            <div class="col-md-12">
              <textarea class="form-control" name="message" rows="6" placeholder="Message" required=""></textarea>
            </div>
          
            </div>
          </div>
          <br />
          <center><button class="btn btn-success btn-rounded btn-lg fw-bold" id="send_message" type="submit">Send Message</button></center>
        </form><!-- End Contact Form -->

      </div>

    </section><!-- /Contact Section -->
{% endif %}
